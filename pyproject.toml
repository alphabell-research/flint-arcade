[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabell-flint-arcade"
version = "0.1.0"
description = "Build, play and remix browser games with alphaBell Flint Arcade"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sandbox = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["arcade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
