name: Checks
on:
  pull_request:
  push:
    branches: [release/initial-publication]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolation prerequisite
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install application and test dependencies
        run: pip install -e '.[test,sandbox]'
      - name: Check application, gateway and packaging contracts
        run: pytest -q
